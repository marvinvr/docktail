# DockTail on a Linux host that already runs Tailscale.
#
# Usage:
#   1. Tag the host and set up the tailnet policy:
#      https://docktail.org/docs/#tailscale-admin-setup
#   2. Copy .env.example to .env and set the Tailscale OAuth credentials.
#   3. docker compose up -d
#
# No Tailscale on the host (macOS, Windows, most NAS devices)? Use
# docker-compose.sidecar.yaml instead. Want monitoring and alerting from
# DockTail Cloud? See docker-compose.cloud.yaml. Building DockTail itself?
# docker-compose.dev.yaml is the development stack.

services:
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    container_name: docktail
    # Required: DockTail exits on purpose when it loses the Tailscale socket and
    # relies on the restart policy to come back with a fresh mount.
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the directory, not the socket file.
      - /var/run/tailscale:/var/run/tailscale
    environment:
      # Optional but recommended. Lets DockTail create Service definitions.
      - TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID}
      - TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET}

  # Example app. No published ports: DockTail proxies to the container IP.
  whoami:
    image: traefik/whoami:latest
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=whoami"
      - "docktail.service.port=80"
